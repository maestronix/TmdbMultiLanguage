name: Jellyfin 12 CI

on:
  push:
    branches: [master, jellyfin-12-port]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Jellyfin 12 plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Validate manifest JSON
        run: jq empty manifest.json

      - name: Validate ABI metadata
        run: |
          test "$(jq -r '.targetAbi' meta.json)" = "12.0.0.0"
          test "$(jq -r '.framework' meta.json)" = "net10.0"

      - name: Package plugin
        run: |
          mkdir -p dist
          cp bin/Release/net10.0/Jellyfin.Plugin.TmdbMultiLanguage.dll dist/
          cp meta.json dist/
          (cd dist && zip -r ../Jellyfin.Plugin.TmdbMultiLanguage.zip .)

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.TmdbMultiLanguage
          path: Jellyfin.Plugin.TmdbMultiLanguage.zip
          if-no-files-found: error
