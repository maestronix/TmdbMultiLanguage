name: Jellyfin 12 CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: |
          mkdir -p dist
          cp bin/Release/net10.0/Jellyfin.Plugin.TmdbMultiLanguage.dll dist/
          (cd dist && zip -r ../Jellyfin.Plugin.TmdbMultiLanguage.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: Jellyfin.Plugin.TmdbMultiLanguage.zip
