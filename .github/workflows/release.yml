name: Build and Release Jellyfin Plugin

on:
  push:
    branches: [master]
    paths:
      - "meta.json"
      - "Jellyfin.Plugin.TmdbMultiLanguage.csproj"
      - "TmdbMultiLanguagePlugin.cs"
      - "TmdbMultiLanguageImageProvider.cs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Plugin
        run: dotnet build --configuration Release --no-restore

      - name: Get version
        id: version
        run: |
          VERSION=$(jq -r '.version' meta.json)
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package plugin
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PLUGIN="Jellyfin.Plugin.TmdbMultiLanguage"
          OUTPUT="bin/Release/net10.0"

          mkdir -p release_package
          cp "$OUTPUT/$PLUGIN.dll" release_package/
          cp meta.json release_package/

          ZIP="$PLUGIN"_v"$VERSION".zip
          (cd release_package && zip -r "../$ZIP" .)

          CHECKSUM=$(md5sum "$ZIP" | awk '{print toupper($1)}')
          echo "$CHECKSUM" > checksum.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Jellyfin TMDB Multi-Language v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: Jellyfin.Plugin.TmdbMultiLanguage_v${{ steps.version.outputs.VERSION }}.zip

      - name: Update Jellyfin repository manifest
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHECKSUM=$(cat checksum.txt)
          ZIP="Jellyfin.Plugin.TmdbMultiLanguage_v${VERSION}.zip"
          SOURCE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${ZIP}"
          CHANGELOG=$(jq -r '.changelog' meta.json)

          jq \
            --arg version "$VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg checksum "$CHECKSUM" \
            --arg sourceUrl "$SOURCE_URL" \
            '.[0].versions = [{
              version: $version,
              changelog: $changelog,
              targetAbi: "12.0.0.0",
              sourceUrl: $sourceUrl,
              checksum: $checksum
            }]' manifest.json > manifest.tmp

          mv manifest.tmp manifest.json

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet || git commit -m "Publish Jellyfin repository manifest for v${{ steps.version.outputs.VERSION }}"
          git push
