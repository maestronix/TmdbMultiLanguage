name: Release Jellyfin 12 Plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version without v prefix
        required: true
        default: 1.1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Package
        run: |
          VERSION="${{ inputs.version }}"
          mkdir package
          cp bin/Release/net10.0/Jellyfin.Plugin.TmdbMultiLanguage.dll package/
          (cd package && zip -r "../Jellyfin.Plugin.TmdbMultiLanguage_v${VERSION}.zip" .)
          md5sum "Jellyfin.Plugin.TmdbMultiLanguage_v${VERSION}.zip" | awk '{print toupper($1)}' > checksum.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: Jellyfin.Plugin.TmdbMultiLanguage_v*.zip
